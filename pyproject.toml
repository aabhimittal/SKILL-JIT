[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-jit"
version = "0.1.0"
description = "Just-in-time skill and tool loading for agent harnesses"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
llm = ["anthropic"]
embed = ["fastembed"]
test = ["pytest>=8"]

[project.scripts]
skilljit = "skilljit.cli:main"

[tool.setuptools]
packages = ["skilljit"]
